spring:
  application:
    name: erpcom
  datasource:
    url: ${ERPCOM_DB_URL:${ERP_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}}
    username: ${ERPCOM_DB_USERNAME:${ERP_DB_USERNAME:erpcom}}
    password: ${ERPCOM_DB_PASSWORD:${ERP_DB_PASSWORD:}}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      data-source-properties:
        oracle.jdbc.J2EE13Compliant: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    time-zone: Asia/Seoul
server:
  port: ${ERPCOM_API_PORT:${ERP_PORT:8082}}
  error:
    include-message: never
    include-stacktrace: never
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    call-setters-on-nulls: true
    jdbc-type-for-null: NULL
    local-cache-scope: STATEMENT
springdoc:
  api-docs:
    enabled: ${erpcom.security.swagger-enabled:false}
  swagger-ui:
    enabled: ${erpcom.security.swagger-enabled:false}
erpcom:
  cors:
    allowed-origin: ${ERPCOM_NEXACRO_ORIGIN:}
  security:
    swagger-enabled: ${ERPCOM_SWAGGER_ENABLED:${ERP_API_DOCS_ENABLED:false}}
